<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Theater Inventory Tracker">
  <!--
    The same proscenium as the in-app mark, drawn solid rather than stroked.

    A tab favicon is rendered at 16px, where an outlined mark on a transparent
    ground disappears into whatever chrome is behind it. A filled tile with the
    arch knocked out of it keeps a shape at that size: the silhouette does the
    work, not the line weight.

    Colours are the product's own — oklch(0.552 0.058 161) and its dark-theme
    counterpart, resolved to sRGB because a favicon file cannot read the
    stylesheet's custom properties.
  -->
  <style>
    .tile { fill: #537d67 }
    .mark { stroke: #e0f1e7 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #94c2a8 }
      .mark { stroke: #0a0f0d }
    }
  </style>
  <rect class="tile" width="24" height="24" rx="5.5" />
  <g class="mark" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 17.5h14" />
    <path d="M7.5 17.5v-6a4.5 4.5 0 0 1 9 0v6" />
  </g>
</svg>
